<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Link an external stylesheet and set base page styles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hello, CSS!</h1>
    <p>This page gets all of its styling from an external stylesheet.</p>
    <p>Change a value in style.css, save, and refresh to see it update.</p>
  </main>
</body>
</html>
