<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Style a data table with borders, zebra rows and a caption</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <table>
      <caption>Comparing three languages</caption>
      <thead>
        <tr><th scope="col">Language</th><th scope="col">Used for</th><th scope="col">Year</th></tr>
      </thead>
      <tbody>
        <tr><td>HTML</td><td>Structure</td><td>1993</td></tr>
        <tr><td>CSS</td><td>Presentation</td><td>1996</td></tr>
        <tr><td>JavaScript</td><td>Behaviour</td><td>1995</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
