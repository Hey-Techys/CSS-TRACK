<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Style a list using element, class and ID selectors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My Tools</h1>
    <ul>
      <li>VS Code</li>
      <li class="highlight">Git</li>
      <li id="favourite">Chrome DevTools</li>
      <li class="highlight">GitHub</li>
    </ul>
  </main>
</body>
</html>
