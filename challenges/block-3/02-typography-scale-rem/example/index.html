<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Set a typography scale for headings and paragraphs using rem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Typography Scale</h1>
    <h2>Section heading</h2>
    <p>Body text sits at 1rem. Headings step up from there so the hierarchy is obvious at a glance.</p>
    <h3>Sub-heading</h3>
    <p>Because these sizes use rem, they grow if the reader increases their browser's default font size.</p>
  </main>
</body>
</html>
