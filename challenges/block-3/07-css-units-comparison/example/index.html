<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Compare px, %, em and rem units side by side</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CSS Units</h1>
    <div class="box px">px — a fixed size that never changes.</div>
    <div class="box percent">% — relative to the parent's width.</div>
    <div class="parent-large">
      <div class="box em">em — relative to this element's font-size (its parent is set to 20px).</div>
    </div>
    <div class="box rem">rem — relative to the root (html) font-size.</div>
  </main>
</body>
</html>
