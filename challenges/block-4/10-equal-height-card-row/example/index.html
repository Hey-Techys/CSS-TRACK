<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Build a row of equal-height cards that wraps on small screens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="cards">
      <article class="card">
        <h2>HTML</h2>
        <p>Structure and meaning.</p>
        <a class="card-link" href="#">Learn more</a>
      </article>
      <article class="card">
        <h2>CSS</h2>
        <p>Selectors, the box model, flexbox and responsive design — everything that makes a page look the way it does.</p>
        <a class="card-link" href="#">Learn more</a>
      </article>
      <article class="card">
        <h2>JavaScript</h2>
        <p>Behaviour and interactivity, coming in January.</p>
        <a class="card-link" href="#">Learn more</a>
      </article>
    </section>
  </main>
</body>
</html>
