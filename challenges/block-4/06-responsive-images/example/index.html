<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Make images responsive so they never overflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Responsive Images</h1>
    <img src="https://placehold.co/1200x600?text=Wide+photo" alt="Placeholder for a wide landscape photo">
    <p>The image above is 1200px wide, but it shrinks to fit this column.</p>
  </main>
</body>
</html>
