<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Build a media object: image beside text that stacks on mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>What participants say</h1>
    <article class="media">
      <img class="media-image" src="https://placehold.co/96x96?text=AS" alt="Portrait of Amina S.">
      <div class="media-body">
        <h2>Amina S.</h2>
        <p>Getting my first PR merged made Git finally click for me.</p>
      </div>
    </article>
    <article class="media">
      <img class="media-image" src="https://placehold.co/96x96?text=TK" alt="Portrait of Tunde K.">
      <div class="media-body">
        <h2>Tunde K.</h2>
        <p>The small issues are perfect — I can finish one in an evening.</p>
      </div>
    </article>
    <article class="media">
      <img class="media-image" src="https://placehold.co/96x96?text=OB" alt="Portrait of Ola B.">
      <div class="media-body">
        <h2>Ola B.</h2>
        <p>Reviewing other people's code taught me as much as writing my own.</p>
      </div>
    </article>
  </main>
</body>
</html>
