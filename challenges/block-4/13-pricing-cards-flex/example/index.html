<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Build responsive pricing cards with a highlighted plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Choose a plan</h1>
    <section class="pricing">
      <article class="plan">
        <h2>Free</h2>
        <p class="price">$0</p>
        <ul><li>Weekly articles</li><li>Community Slack</li></ul>
        <a class="plan-cta" href="#">Get started</a>
      </article>
      <article class="plan plan-featured">
        <h2>Pro</h2>
        <p class="price">$9</p>
        <ul><li>Everything in Free</li><li>Code reviews</li><li>Live sessions</li></ul>
        <a class="plan-cta" href="#">Go Pro</a>
      </article>
      <article class="plan">
        <h2>Team</h2>
        <p class="price">$29</p>
        <ul><li>Everything in Pro</li><li>Up to 5 members</li></ul>
        <a class="plan-cta" href="#">Contact us</a>
      </article>
    </section>
  </main>
</body>
</html>
